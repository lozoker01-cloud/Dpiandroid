name: Build Zapret APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unpack ZapretAndroid.zip
        run: |
          unzip -q ZapretAndroid.zip -d extracted
          PROJ_DIR=$(dirname "$(find extracted -name "settings.gradle.kts" | head -n 1)")
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapretDPI-APK
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          
